name: Assemble icon binaries

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: assemble-icons
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode icon binaries into PNG/ICO assets
        run: |
          set -euo pipefail
          python3 artifacts/advanced-creation-studio/scripts/decode-icon-binaries.py
          test -f artifacts/advanced-creation-studio/public/apple-touch-icon.png
          test -f artifacts/advanced-creation-studio/public/android-chrome-512x512.png
          test -f artifacts/advanced-creation-studio/public/android-chrome-512x512-maskable.png
          test -f artifacts/advanced-creation-studio/public/favicon.ico
          python3 - <<'PY'
          import subprocess, sys
          try:
            from PIL import Image
          except ImportError:
            subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-q', 'pillow'])
            from PIL import Image
          im = Image.open('artifacts/advanced-creation-studio/public/android-chrome-512x512.png').convert('RGB')
          corner = im.getpixel((0, 0))
          assert corner[0] < 80, corner
          print('corner OK', corner)
          PY

      - name: Commit decoded PWA and favicon icons
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/advanced-creation-studio/public/favicon-16x16.png \
            artifacts/advanced-creation-studio/public/favicon-32x32.png \
            artifacts/advanced-creation-studio/public/favicon.ico \
            artifacts/advanced-creation-studio/public/apple-touch-icon.png \
            artifacts/advanced-creation-studio/public/android-chrome-192x192.png \
            artifacts/advanced-creation-studio/public/android-chrome-512x512.png \
            artifacts/advanced-creation-studio/public/android-chrome-192x192-maskable.png \
            artifacts/advanced-creation-studio/public/android-chrome-512x512-maskable.png
          if git diff --cached --quiet; then
            echo "No icon changes"
            exit 0
          fi
          git commit -m "chore: update PWA and favicon icon binaries"
          git push
