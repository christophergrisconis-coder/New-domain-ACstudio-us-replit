name: Assemble icon-binaries bundle

on:
  workflow_dispatch:
  push:
    paths:
      - "artifacts/advanced-creation-studio/public/.icon-staging/**"
      - ".github/workflows/assemble-icon-binaries.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble icon-binaries.b64.json
        run: |
          python3 <<'PY'
          from pathlib import Path
          import hashlib
          root = Path("artifacts/advanced-creation-studio/public")
          staging = root / ".icon-staging"
          parts = sorted(staging.glob("part*.txt"))
          assert parts, "no staging parts"
          data = "".join(p.read_text() for p in parts)
          expected = "eb97f35fd35269b68055e4d444bbb09e492ff0fedc51ec3d234facea5bb4cda4"
          got = hashlib.sha256(data.encode()).hexdigest()
          assert got == expected, f"sha mismatch {got}"
          assert len(data) == 92791
          out = root / "icon-binaries.b64.json"
          out.write_text(data)
          print(f"wrote {out} ({len(data)} bytes)")
          for p in parts:
              p.unlink()
          print("removed staging parts")
          PY
      - name: Commit assembled bundle
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add base64 icon binary bundle for PWA/favicon assets"
          file_pattern: |
            artifacts/advanced-creation-studio/public/icon-binaries.b64.json
            artifacts/advanced-creation-studio/public/.icon-staging/*
